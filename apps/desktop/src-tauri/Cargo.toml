[package]
name = "trem-lite"
version = "26.1.0-26w39a"
description = "Taiwan Real-time Earthquake Monitoring"
authors = ["ExpTechTW <ExpTech.tw@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
name = "trem_lite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
# `gzip` is required: the HTTP proxy (http_proxy.rs) forces `Accept-Encoding:
# gzip` on every outbound request and relies on reqwest's transparent decoding.
# We re-use the plugin's re-exported reqwest so the TLS backend and the crate
# version stay in lockstep with the plugin's own client.
tauri-plugin-http = { version = "2", features = ["gzip"] }
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-os = "2"
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
# `log` facade (level filters + macros) and `time` for logging.rs's custom
# local-timezone millisecond timestamp format.
log = "0.4"
time = { version = "0.3", features = ["macros", "formatting"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Audio playback lives entirely in Rust (rodio) so OBS window capture works.
rodio = "0.20"

# HTTP proxy cache: SQLite holds the ETag/body store (bundled so no system
# libsqlite3 is needed on any build host), flate2 does the max-level gzip that
# every cached body is stored under.
rusqlite = { version = "0.37", features = ["bundled"] }
flate2 = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
# OTA (src/updater.rs): re-verifying a staged package's signature before it is
# installed, and the timer between checks. All three are already in the tree
# through the updater plugin and tauri; naming them costs no build time.
minisign-verify = "0.2"
base64 = "0.22"
tokio = { version = "1", features = ["time"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
