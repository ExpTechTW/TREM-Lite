[package]
name = "trem-lite-native"
version = "0.1.0"
edition = "2021"
publish = false
description = "TREM-Lite native (winit + wgpu)"

[[bin]]
name = "trem-lite-native"
path = "src/main.rs"

[dependencies]
# The libraries shared with other TREM apps, from ExpTechTW/trem-native-rust. All of them,
# here and in [dev-dependencies], name one rev; README.md says how to move it.
trem-core = { git = "https://github.com/ExpTechTW/trem-native-rust", rev = "e315fc5d0382f82267397e6f9228f65a76ae279e", features = ["rayon"] }
trem-io = { git = "https://github.com/ExpTechTW/trem-native-rust", rev = "e315fc5d0382f82267397e6f9228f65a76ae279e" }
trem-gfx = { git = "https://github.com/ExpTechTW/trem-native-rust", rev = "e315fc5d0382f82267397e6f9228f65a76ae279e", features = ["dem", "tray", "autostart", "notify", "speech", "awake"] }
bytes = { version = "1", default-features = false, features = ["std"] }
bytemuck = { version = "1", default-features = false, features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
# One pool of worker threads, as many as cores, for the CPU work: tiles, glyphs, the model.
rayon = "1.12"
log = { version = "0.4", default-features = false, features = ["std"] }
wgpu = { version = "30", default-features = false, features = ["std", "wgsl"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
# std's Instant and SystemTime panic in a browser; this is std's own off the web.
web-time = "1"

# The desktop: its own network stack, cache, sound, tray and runtime.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Same reqwest the desktop proxy rides on (tauri-plugin-http 2.5.9 → 0.12.28):
# rustls, http2, charset, cookies, macOS proxy config, gzip, plus stream for SSE.
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "http2", "charset", "cookies", "macos-system-configuration", "gzip", "stream"] }
# mp3 only: the bundled clips are mp3. Desktop enables flac/vorbis/wav too.
rodio = { version = "0.20", default-features = false, features = ["mp3"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }

# The browser: fetch for the network, WebGPU for drawing, one thread.
[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "=0.12.28", default-features = false, features = ["stream"] }
tokio = { version = "1", default-features = false, features = ["sync"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "wasmbind"] }
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "webgpu", "fragile-send-sync-non-atomic-wasm"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "HtmlAudioElement", "HtmlMediaElement", "Storage", "Location", "Navigator", "console", "Performance"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "metal", "gles"] }

[target.'cfg(target_os = "ios")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "metal"] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "dx12", "gles"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "vulkan", "gles"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland"] }

# A workspace of its own, whatever folder holds the checkout: Cargo.lock and the profile
# below are the app's, and they hold for the libraries too.
[workspace]

# The timers' and the map's virtual clocks, for the tests that run the whole app. The same
# source and rev as in [dependencies], or Cargo takes them for other crates.
[dev-dependencies]
trem-io = { git = "https://github.com/ExpTechTW/trem-native-rust", rev = "e315fc5d0382f82267397e6f9228f65a76ae279e", features = ["testing"] }
trem-gfx = { git = "https://github.com/ExpTechTW/trem-native-rust", rev = "e315fc5d0382f82267397e6f9228f65a76ae279e", features = ["testing"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
# panic = "unwind" is the default. Event handlers catch_unwind, matching lib/events.ts.
