[package]
name = "trem-lite-native"
version = "0.1.0"
edition = "2021"
publish = false
description = "TREM-Lite native (winit + wgpu)"

[[bin]]
name = "trem-lite-native"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
bytes = { version = "1", default-features = false, features = ["std"] }
bytemuck = { version = "1", default-features = false, features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = { version = "6", default-features = false }
earcutr = { version = "0.5", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Same reqwest the desktop proxy rides on (tauri-plugin-http 2.5.9 → 0.12.28):
# rustls, http2, charset, cookies, macOS proxy config, gzip, plus stream for SSE.
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "http2", "charset", "cookies", "macos-system-configuration", "gzip", "stream"] }
# mp3 only: the bundled clips are mp3. Desktop enables flac/vorbis/wav too.
rodio = { version = "0.20", default-features = false, features = ["mp3"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
# `swash` rasterizes glyphs; `std` pulls fontdb's memmap so system fonts can be
# opened later. `fontconfig` is Linux-only and stays off here (see the target
# table below). Default features also turn on fontconfig, which we do not want
# on macOS or Windows.
cosmic-text = { version = "0.19", default-features = false, features = ["std", "swash"] }
image = { version = "0.25", default-features = false, features = ["png"] }
log = { version = "0.4", default-features = false, features = ["std"] }
pollster = { version = "0.4", default-features = false }
# Script enum for the font fallback list. Already pulled in by cosmic-text.
unicode-script = { version = "0.5", default-features = false }
wgpu = { version = "30", default-features = false, features = ["std", "wgsl"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
notify-rust = "4"
auto-launch = "0.5"
os_info = { version = "3", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
tts = { version = "0.26", default-features = false }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSRunningApplication", "NSView", "NSWindow", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", features = ["NSProcessInfo", "NSString"] }
tray-icon = { version = "0.24", default-features = false }
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "metal", "gles"] }

[target.'cfg(target_os = "ios")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "metal"] }

[target.'cfg(target_os = "windows")'.dependencies]
tts = { version = "0.26", default-features = false }
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "dx12", "gles"] }
tray-icon = { version = "0.24", default-features = false }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
tts = "0.26"
ksni = { version = "0.3", default-features = false, features = ["blocking", "tokio"] }
cosmic-text = { version = "0.19", default-features = false, features = ["std", "swash", "fontconfig"] }
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "vulkan", "gles"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
# panic = "unwind" is the default. Event handlers catch_unwind, matching lib/events.ts.
