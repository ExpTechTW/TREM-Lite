[package]
name = "trem-lite-native"
version = "0.1.0"
edition = "2021"
publish = false
description = "TREM-Lite native (winit + wgpu)"

[[bin]]
name = "trem-lite-native"
path = "src/main.rs"

[dependencies]
# The libraries beside the app, in crates/: shared with other TREM apps.
trem-core = { path = "crates/trem-core", features = ["rayon"] }
trem-io = { path = "crates/trem-io" }
trem-gfx = { path = "crates/trem-gfx" }
bytes = { version = "1", default-features = false, features = ["std"] }
bytemuck = { version = "1", default-features = false, features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
earcutr = { version = "0.5", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png"] }
# One pool of worker threads, as many as cores, for the CPU work: tiles, glyphs, the model.
rayon = "1.12"
log = { version = "0.4", default-features = false, features = ["std"] }
wgpu = { version = "30", default-features = false, features = ["std", "wgsl"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
# std's Instant and SystemTime panic in a browser; this is std's own off the web.
web-time = "1"

# The desktop: its own network stack, cache, sound, tray and runtime.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Same reqwest the desktop proxy rides on (tauri-plugin-http 2.5.9 → 0.12.28):
# rustls, http2, charset, cookies, macOS proxy config, gzip, plus stream for SSE.
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "http2", "charset", "cookies", "macos-system-configuration", "gzip", "stream"] }
# mp3 only: the bundled clips are mp3. Desktop enables flac/vorbis/wav too.
rodio = { version = "0.20", default-features = false, features = ["mp3"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
pollster = { version = "0.4", default-features = false }
notify-rust = "4"
auto-launch = "0.5"
os_info = { version = "3", default-features = false }

# The browser: fetch for the network, WebGPU for drawing, one thread.
[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "=0.12.28", default-features = false, features = ["stream"] }
tokio = { version = "1", default-features = false, features = ["sync"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "wasmbind"] }
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "webgpu", "fragile-send-sync-non-atomic-wasm"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "HtmlAudioElement", "HtmlMediaElement", "Storage", "Location", "Navigator", "console", "Performance", "Clipboard", "Notification", "NotificationOptions", "NotificationPermission", "SpeechSynthesis", "SpeechSynthesisUtterance"] }

[target.'cfg(target_os = "macos")'.dependencies]
tts = { version = "0.26", default-features = false }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSRunningApplication", "NSView", "NSWindow", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", features = ["NSProcessInfo", "NSString"] }
tray-icon = { version = "0.24", default-features = false }
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "metal", "gles"] }

[target.'cfg(target_os = "ios")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "metal"] }

[target.'cfg(target_os = "windows")'.dependencies]
tts = { version = "0.26", default-features = false }
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "dx12", "gles"] }
tray-icon = { version = "0.24", default-features = false }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
tts = "0.26"
ksni = { version = "0.3", default-features = false, features = ["blocking", "tokio"] }
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "vulkan", "gles"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland"] }

# The app, and beside it in crates/ the libraries it shares with other TREM apps.
[workspace]
members = ["crates/*"]
# A bare `cargo test`, `cargo clippy` or `cargo build` here covers the libraries too.
default-members = [".", "crates/*"]

# What every library says of itself. The app's version is the one in [package], which
# packaging/bundle-macos.sh reads.
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false
repository = "https://github.com/ExpTechTW/trem-native-rust"

# The timers' virtual clock, for the tests that run the whole app.
[dev-dependencies]
trem-io = { path = "crates/trem-io", features = ["testing"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
# panic = "unwind" is the default. Event handlers catch_unwind, matching lib/events.ts.
