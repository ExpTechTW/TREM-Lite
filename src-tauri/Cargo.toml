[package]
name = "trem-lite"
version = "4.0.0"
description = "Taiwan Real-time Earthquake Monitoring"
authors = ["ExpTechTW <ExpTech.tw@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
name = "trem_lite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-http = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-os = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-log = "2"
# `log` facade (level filters + macros) and `time` for logging.rs's custom
# local-timezone millisecond timestamp format.
log = "0.4"
time = { version = "0.3", features = ["macros", "formatting"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Audio playback lives entirely in Rust (rodio) so OBS window capture works.
rodio = "0.20"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
