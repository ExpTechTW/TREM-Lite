name: Release

# Two kinds of build, one pipeline — the naming scheme is in commit.md.
#
#   push to main   a snapshot: `26w39a`, published as a PRE-release once every
#                  target is in.
#   push of `v*`   a release:  `v26.2`, left as a DRAFT for a human.
#
# The asymmetry is deliberate. GitHub's "latest" release never points at a
# prerelease, and `latest.json` — what the Tauri updater reads — is served from
# `releases/latest`, so a snapshot cannot reach anyone running a release. A real
# release does become "latest" and drives OTA to every installed copy, so it
# waits as a draft for a human to publish.
#
# Every release starts as a draft, snapshots included, so a snapshot is either
# complete or invisible: `version` creates the draft, the builds fill it,
# `publish` finishes it, and `discard` deletes it if anything failed.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Never two release runs at once: both would compute a snapshot letter from the
# same set of tags and hand out the same one twice.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The one place the version is decided; every job below reads it from here.
  # Recomputing it on a build runner would be wrong — see tool/release/version.sh.
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      label: ${{ steps.derive.outputs.label }}
      semver: ${{ steps.derive.outputs.semver }}
      msi: ${{ steps.derive.outputs.msi }}
      code: ${{ steps.derive.outputs.code }}
      tag: ${{ steps.derive.outputs.tag }}
      is_release: ${{ steps.derive.outputs.is_release }}
      release_id: ${{ steps.release.outputs.id }}
    steps:
      # Full history: the label counts this year's commits and this week's tags.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive the version
        id: derive
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          eval "$(tool/release/version.sh)"
          if [ "$REF_TYPE" = tag ]; then
            is_release=true
            tag="$REF_NAME"
          else
            is_release=false
            tag="$TREM_LABEL"
          fi
          {
            echo "label=$TREM_LABEL"
            echo "semver=$TREM_SEMVER"
            echo "msi=$TREM_MSI"
            echo "code=$TREM_CODE"
            echo "tag=$tag"
            echo "is_release=$is_release"
          } >>"$GITHUB_OUTPUT"
          echo "$tag → $TREM_SEMVER (msi $TREM_MSI, code $TREM_CODE)"

      # The release exists, as a draft, before any build starts, and every build
      # uploads into it by id.
      #
      # Left to the builds, each target looks the release up by tag and creates
      # it when absent (tauri-action's create-release.ts), with nothing to catch
      # the collision: two targets that finish together both see "absent", both
      # create, and the second dies on `already_exists` with its artifacts built
      # and signed. The first snapshot lost its arm64 build exactly that way.
      #
      # A snapshot's tag is not pushed here. A draft does not need its tag to
      # exist — GitHub creates it at `target_commitish` when the draft is
      # published — so a snapshot that never publishes never has a tag. That
      # matters beyond tidiness: the next snapshot's note is a delta from the
      # nearest tag, and an orphaned one would silently swallow every entry it
      # carried.
      - name: Create the draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.derive.outputs.tag }}
          LABEL: ${{ steps.derive.outputs.label }}
          PRERELEASE: ${{ steps.derive.outputs.is_release == 'false' }}
          SHA: ${{ github.sha }}
        run: |
          # A re-run finds the draft its first attempt created. Drafts only: a
          # published release under this tag is live, and uploading into it
          # would rewrite what users are downloading. Creating a second one
          # fails instead, which is the right outcome.
          id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            -q '.[] | select(.tag_name == env.TAG and .draft) | .id' | head -n 1)"
          if [ -z "$id" ]; then
            id="$(gh api "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" -f target_commitish="$SHA" \
              -f name="TREM-Lite $LABEL" \
              -F draft=true -F prerelease="$PRERELEASE" -q .id)"
          fi
          echo "id=$id" >>"$GITHUB_OUTPUT"
          echo "draft $id for $TAG"

  build:
    needs: version
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS — universal (one .dmg + one updater artifact for both Apple
          # Silicon & Intel). Per-arch mac builds would collide on the arch-less
          # `TREM-Lite.app.tar.gz` updater artifact when uploaded to one release.
          - platform: macos-latest
            target: aarch64-apple-darwin,x86_64-apple-darwin
            args: "--target universal-apple-darwin"
          # Linux — x86_64 (amd64) + arm64. arm64 uses a GitHub-hosted ARM runner.
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
          - platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            args: ""
          # Windows — x64 + arm64 + 32-bit (ia32). arm64/ia32 cross-compile on the x64 runner.
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: "--target x86_64-pc-windows-msvc"
          - platform: windows-latest
            target: aarch64-pc-windows-msvc
            args: "--target aarch64-pc-windows-msvc"
          - platform: windows-latest
            target: i686-pc-windows-msvc
            args: "--target i686-pc-windows-msvc"

    runs-on: ${{ matrix.platform }}
    steps:
      # The commit this run was started for, not the branch: a push to main that
      # lands while this matrix is running would otherwise have some targets
      # build a different tree than the others, all attached to one release.
      # Not the tag either — a snapshot does not have one until it publishes.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      # xdg-utils: the AppImage carries its own copy of `xdg-open` (what the
      # opener plugin launches on Linux), taken from the build host. The x64
      # runner image happens to ship it; the arm64 one does not, and the first
      # snapshot's arm64 build died there.
      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev xdg-utils

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./apps/desktop/src-tauri -> target"
          key: ${{ matrix.target }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      # Stamp the version this run was named for. `--write` takes it from the
      # environment rather than recomputing: this checkout is shallow, so it can
      # count neither this week's snapshots nor the year's commits, and both the
      # label and the MSI version would come out wrong.
      - name: Stamp the version
        shell: bash
        env:
          TREM_SEMVER: ${{ needs.version.outputs.semver }}
          TREM_MSI: ${{ needs.version.outputs.msi }}
        run: bash tool/release/version.sh --write

      - name: Build & upload (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing / notarization (optional — set these repo secrets)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Tauri updater signing
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          # Into the draft `version` created — see there for why no build may
          # create a release itself. `tagName` still matters alongside the id:
          # a draft's download URLs read `untagged-…` until it is published, and
          # tauri-action rewrites them to this tag when it writes latest.json.
          releaseId: ${{ needs.version.outputs.release_id }}
          tagName: ${{ needs.version.outputs.tag }}
          args: ${{ matrix.args }}

  # Finish the draft, once, after every target has uploaded: friendly asset
  # names, the release note, and — for a snapshot — publication.
  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Full history: the note walks back to the previous tag, and for a release
      # back to the previous *release* tag.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Rename the assets to TREM-Lite-<version>-<os>-<arch>.<ext> (arm64 / x64 /
      # ia32) and patch latest.json's URLs to match. Updater signatures are
      # embedded in latest.json and depend on file content, so renaming keeps
      # OTA valid.
      - name: Rename assets + patch latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: bun scripts/rename-release-assets.mjs

      # latest.json is the one artifact nothing else checks, and it fails
      # silently: a platform missing from it is a platform that never updates,
      # and a URL naming a file the rename moved is a 404 on every installed
      # copy. tauri-action writes it from every build at once with no lock —
      # each reads it, merges its own platform, deletes it and uploads it again
      # — so two builds that finish together can drop each other's entry, and
      # no step reports it.
      #
      # WANT follows the build matrix; the universal macOS build answers for
      # both darwin keys.
      - name: Check the updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.version.outputs.release_id }}
          TAG: ${{ needs.version.outputs.tag }}
          WANT: >-
            darwin-aarch64 darwin-x86_64 linux-x86_64 linux-aarch64
            windows-x86_64 windows-aarch64 windows-i686
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" \
            -q '.[] | "\(.id)\t\(.name)"' >/tmp/assets.tsv
          id="$(awk -F'\t' '$2 == "latest.json" { print $1 }' /tmp/assets.tsv)"
          if [ -z "$id" ]; then
            echo "::error::the release has no latest.json"
            exit 1
          fi
          gh api -H 'Accept: application/octet-stream' \
            "repos/$GITHUB_REPOSITORY/releases/assets/$id" >/tmp/latest.json
          python3 - <<'PY'
          import json, os, sys

          tag = os.environ["TAG"]
          names = {line.rstrip("\n").split("\t", 1)[1] for line in open("/tmp/assets.tsv")}
          platforms = json.load(open("/tmp/latest.json"))["platforms"]

          bad = [f"no entry for {p}" for p in os.environ["WANT"].split() if p not in platforms]
          for key, entry in sorted(platforms.items()):
              url = entry.get("url", "")
              name = url.rsplit("/", 1)[-1]
              if f"/releases/download/{tag}/" not in url:
                  bad.append(f"{key} is not under this tag: {url}")
              elif name not in names:
                  bad.append(f"{key} points at {name}, which is not on the release")
              if not entry.get("signature"):
                  bad.append(f"{key} has no signature")

          for b in bad:
              print(f"::error::latest.json: {b}")
          if bad:
              sys.exit(1)
          print(f"latest.json: {len(platforms)} entries, every target present, every URL resolves")
          PY

      # The note is built from the changelog lines the commits declare — see
      # commit.md and tool/release/notes.sh. Written after the rename so the
      # body and the asset names describe the same release.
      - name: Write the release note
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_ID: ${{ needs.version.outputs.release_id }}
          TAG: ${{ needs.version.outputs.tag }}
          LABEL: ${{ needs.version.outputs.label }}
          CODE: ${{ needs.version.outputs.code }}
          IS_RELEASE: ${{ needs.version.outputs.is_release }}
        run: |
          if [ "$IS_RELEASE" = true ]; then
            bash tool/release/notes.sh "$LABEL" "$CODE" --release >/tmp/notes.md
          else
            bash tool/release/notes.sh "$LABEL" "$CODE" >/tmp/notes.md
          fi
          cat /tmp/notes.md
          # By id: a draft cannot be looked up by its tag.
          #
          # `tag_name` rides along on every edit, never only the field being
          # changed. A draft whose tag does not exist yet is renamed
          # `untagged-…` by any PATCH that omits it, and published in that state
          # it gets no tag at all — every updater URL in latest.json a 404. The
          # first snapshot went out exactly that way.
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -f tag_name="$TAG" -F body=@/tmp/notes.md >/dev/null

      # Last, so a snapshot goes public complete: every target in, names final,
      # note written. GitHub creates its tag at this moment, from
      # `target_commitish` — restated here for the same reason as above.
      - name: Publish the snapshot
        if: needs.version.outputs.is_release == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.version.outputs.release_id }}
          TAG: ${{ needs.version.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -f tag_name="$TAG" -f target_commitish="$SHA" -F draft=false -q .html_url

  # A snapshot that fails anywhere — a build, the rename, the note — is deleted
  # rather than published incomplete. It never got a tag (see `version`), so the
  # draft is all there is to remove, and the next snapshot reuses its name.
  #
  # A release is never touched: a human pushed its tag, and a human decides
  # what happens to its draft.
  discard:
    needs: [version, build, publish]
    # `version` must have succeeded: it created the draft this deletes, so its
    # success is what proves the id names this run's release.
    if: >-
      (failure() || cancelled())
      && needs.version.result == 'success'
      && needs.version.outputs.is_release == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete the unfinished snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.version.outputs.release_id }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"
          # A tag exists only if publication itself went through and something
          # after it failed. Nothing else can own the name: it was free when
          # `version` computed it, and release runs never overlap.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG"
          fi
          echo "discarded $TAG; the next snapshot reuses the name"
