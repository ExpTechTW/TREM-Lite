name: Deploy Web

# Builds the @trem/web shell (reuses @trem/core) and deploys it to GitHub Pages.
# Enable Pages once in repo Settings → Pages → Source = "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push cancels an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Build web
        run: bun run --filter @trem/web build

      # The snapshot update channel (see release.yml, `Refresh the snapshot
      # channel`): the newest published snapshot's latest.json, served as a
      # static file. Nothing to add before the first snapshot.
      - name: Add the snapshot update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 30 \
            --json tagName,isPrerelease \
            -q '[.[] | select(.isPrerelease and (.tagName | test("^[0-9]{2}w[0-9]{2}[a-z]+$")))][0].tagName // ""')"
          if [ -z "$tag" ]; then
            echo "no snapshot published yet"
            exit 0
          fi
          mkdir -p apps/web/dist/updater
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" -p latest.json -O apps/web/dist/updater/snapshot.json
          echo "snapshot channel → $tag"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
